spring.datasource.username=postgres.nduuwkfxyxkjiaxnyfji
spring.datasource.password=Alishbanimilayesha
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server Port
server.port=8000

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allow-credentials=true

# JWT Configuration
jwt.secret=SehatVault_Super_Secret_Key_Change_This_In_Production_At_Least_256_Bits_Long_Random_String_2026
jwt.expiration=86400000

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Blockchain Configuration
# Network URL - Hardhat local network or Ethereum network RPC endpoint
blockchain.network.url=http://127.0.0.1:8545
# Chain ID - 31337 for Hardhat local, 1 for mainnet, 11155111 for Sepolia testnet
blockchain.network.chain-id=31337
# Mock mode - set to true to bypass actual blockchain calls (for testing)
blockchain.mock-mode=false

# Smart Contract Addresses - Update after deploying contracts
# These must match the deployed contract addresses from Hardhat deployment
