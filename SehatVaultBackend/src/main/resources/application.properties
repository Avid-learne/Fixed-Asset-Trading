spring.application.name=SehatVaultBackend
spring.profiles.active=local

# Supabase PostgreSQL Configuration (Production - override with SPRING_PROFILES_ACTIVE=prod)
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require&stringtype=unspecified
spring.datasource.username=postgres.nduuwkfxyxkjiaxnyfji
spring.datasource.password=Alishbanimilayesha
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server Port
server.port=8000

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allow-credentials=true

# JWT Configuration
jwt.secret=SehatVault_Super_Secret_Key_Change_This_In_Production_At_Least_256_Bits_Long_Random_String_2026
jwt.expiration=86400000

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Blockchain Configuration
# Network URL - Hardhat local network or Ethereum network RPC endpoint
blockchain.network.url=http://127.0.0.1:8545
# Chain ID - 31337 for Hardhat local, 1 for mainnet, 11155111 for Sepolia testnet
blockchain.network.chain-id=31337
# Mock mode - set to true to bypass actual blockchain calls (for testing)
blockchain.mock-mode=true

# Smart Contract Addresses - Update after deploying contracts
# These must match the deployed contract addresses from Hardhat deployment
blockchain.contract.asset-token-address=0x5FC8d32690cc91D4c39d9d3abcBD16989F875707
blockchain.contract.health-token-address=0x0165878A594ca255338adfa4d48449f69242Eb8F
blockchain.contract.hospital-financials-address=0xa513E6E4b8f2a923D98304ec87F64353C4D5C853

# Hospital Wallet Configuration
# Private key of the hospital admin wallet (used to sign transactions)
# WARNING: Never commit real private keys to version control!
# Use environment variables in production
blockchain.wallet.address=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
blockchain.wallet.private-key=${BLOCKCHAIN_WALLET_PRIVATE_KEY:ac0974bec39a17e36ba4a6b4d238ff944bacb476cadcccea8b0f1852f58c5d25}

# Transaction Configuration
# Gas price in Wei (default: 20 Gwei)
blockchain.transaction.gas-price=20000000000
# Gas limit for contract calls (default: 300000)
blockchain.transaction.gas-limit=300000